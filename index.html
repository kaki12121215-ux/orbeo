<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<title>Orbeo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orbeo">
<meta name="theme-color" content="#F7F4EF" id="tc">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Orbeo · planifica viajes en grupo, día a día.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script>
/* Tema antes de pintar nada, para que no haya fogonazo al abrir. */
try{var t=localStorage.getItem('orbeo-tema')||'auto';var o=t==='oscuro'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.tema=o?'oscuro':'claro';document.getElementById('tc').content=o?'#0B0B0C':'#F7F4EF';}catch(e){}
</script>
<style>html,body{background:#F7F4EF}html[data-tema="oscuro"],html[data-tema="oscuro"] body{background:#0B0B0C}</style>
</head>
<body>
<div id="app"></div>
<div id="capas"></div>
<div id="avisos"></div>
<noscript>Orbeo necesita JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
